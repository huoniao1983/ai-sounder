name: Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyinstaller

      - name: Run engine tests
        run: python -m pytest

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Python sidecar
        working-directory: desktop
        shell: pwsh
        run: ./scripts/build-sidecar.ps1 -SkipInstall

      - name: Build desktop application
        working-directory: desktop
        run: npm run tauri build

      - name: Create portable archive
        shell: pwsh
        run: |
          $release = "desktop/src-tauri/target/release"
          $portable = "$release/bundle/portable/AISounder-${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item "$release/aisounder.exe" $portable
          Copy-Item "$release/aisounder-engine.exe" $portable
          Copy-Item "assets" $portable -Recurse
          Compress-Archive -Path "$portable/*" `
            -DestinationPath "$release/bundle/portable/AISounder_0.1.0_x64-portable.zip"

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: AISounder-Windows-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/portable/*.zip
